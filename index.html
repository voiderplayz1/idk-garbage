<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Web Engine</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; user-select: none; }
        
        /* --- UI OVERLAY --- */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 0v20M0 10h20" stroke="white" stroke-width="2"/></svg>');
            transform: translate(-50%, -50%); mix-blend-mode: difference;
        }

        /* Hotbar */
        #hotbar-container {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5); padding: 5px; border-radius: 5px;
            display: flex; gap: 5px; pointer-events: auto;
        }
        
        .slot {
            width: 40px; height: 40px; border: 2px solid #555; background-color: rgba(0,0,0,0.2);
            display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 12px;
            transition: border-color 0.1s;
        }

        .slot.active { border-color: white; border-width: 4px; background-color: rgba(255,255,255,0.1); }
        
        /* Inventory (Hidden by default) */
        #inventory {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85); padding: 20px; border-radius: 10px; border: 2px solid #fff;
            pointer-events: auto; text-align: center; color: white;
        }
        
        #inventory h2 { margin-top: 0; }
        #inv-grid { display: grid; grid-template-columns: repeat(3, 50px); gap: 10px; margin-top: 15px; }
        .inv-item { width: 50px; height: 50px; border: 1px solid #888; cursor: pointer; display: grid; place-items: center;}
        .inv-item:hover { background: rgba(255,255,255,0.2); }

        /* Instructions */
        #info { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 1px 1px 0 #000; pointer-events: none; }
    </style>
</head>
<body>

    <!-- UI Elements -->
    <div id="ui-layer">
        <div id="info">
            <b>Voxel Engine JS</b><br>
            WASD: Move | SPACE: Jump | CLICK: Mine/Place<br>
            1-9 / Scroll: Select Block | 'E': Inventory
        </div>
        <div id="crosshair"></div>
        <div id="hotbar-container">
            <!-- Generated by JS -->
        </div>
        <div id="inventory">
            <h2>INVENTORY</h2>
            <p>Click to Select</p>
            <div id="inv-grid"></div>
            <br><small>Press 'E' to close</small>
        </div>
    </div>

    <!-- Three.js Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        /**
         * ------------------------------------------------------------------
         * SYSTEM 1: PROCEDURAL TEXTURE GENERATION
         * Generates 16x16 pixel art textures on the fly using HTML5 Canvas
         * ------------------------------------------------------------------
         */
        const textureLoader = new THREE.TextureLoader();
        const materials = {};
        
        function createTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64; // Higher res for crisp look, simulated pixelation
            const ctx = canvas.getContext('2d');
            
            // Helper for noise
            const noise = (factor) => (Math.random() - 0.5) * factor;

            // Base fill
            if (type.includes('grass')) ctx.fillStyle = '#5bac36';
            if (type === 'dirt') ctx.fillStyle = '#754828';
            if (type === 'stone') ctx.fillStyle = '#7d7d7d';
            if (type === 'wood') ctx.fillStyle = '#5c3a23';
            if (type === 'leaves') ctx.fillStyle = '#3a6b22';
            if (type === 'diamond') ctx.fillStyle = '#7d7d7d';
            if (type === 'bedrock') ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, 64, 64);

            // Add noise/details
            for (let i = 0; i < 400; i++) {
                const x = Math.floor(Math.random() * 64);
                const y = Math.floor(Math.random() * 64);
                const w = Math.floor(Math.random() * 4) + 2;
                const h = Math.floor(Math.random() * 4) + 2;

                if (type.includes('grass') || type === 'leaves') ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.1})`;
                if (type === 'dirt' || type === 'wood') ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.15})`;
                if (type === 'stone' || type === 'diamond') ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.2})`;
                
                ctx.fillRect(x, y, w, h);
            }

            // Specific patterns
            if (type === 'grass_side') {
                ctx.fillStyle = '#754828'; // Dirt bottom
                ctx.fillRect(0, 20, 64, 44);
                // Add noise to dirt part
                for(let i=0; i<200; i++) {
                    ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.2})`;
                    ctx.fillRect(Math.random()*64, 20+Math.random()*44, 4, 4);
                }
            }
            
            if (type === 'wood') {
                // Stripes
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                for(let i=4; i<64; i+=8) ctx.fillRect(i, 0, 2, 64);
            }

            if (type === 'diamond') {
                ctx.fillStyle = '#00ffff';
                for(let i=0; i<8; i++) {
                    ctx.fillRect(Math.random()*50, Math.random()*50, 8, 8);
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter; // Keep pixelated look
            return tex;
        }

        // Generate Material Map
        const texGrassTop = createTexture('grass_top');
        const texGrassSide = createTexture('grass_side');
        const texDirt = createTexture('dirt');
        const texStone = createTexture('stone');
        const texWood = createTexture('wood');
        const texLeaves = createTexture('leaves');
        const texDiamond = createTexture('diamond');

        // Block Type Definition (ID -> Materials)
        const BLOCKS = {
            1: { name: 'Grass', mats: [texGrassSide, texGrassSide, texGrassTop, texDirt, texGrassSide, texGrassSide] },
            2: { name: 'Dirt', mats: [texDirt, texDirt, texDirt, texDirt, texDirt, texDirt] },
            3: { name: 'Stone', mats: [texStone, texStone, texStone, texStone, texStone, texStone] },
            4: { name: 'Wood', mats: [texWood, texWood, texWood, texWood, texWood, texWood] },
            5: { name: 'Leaves', mats: [texLeaves, texLeaves, texLeaves, texLeaves, texLeaves, texLeaves] },
            6: { name: 'Diamond', mats: [texDiamond, texDiamond, texDiamond, texDiamond, texDiamond, texDiamond] }
        };

        // Helper to get ThreeJS material array for a block ID
        function getBlockMaterial(id) {
            if (!BLOCKS[id]) return null;
            return BLOCKS[id].mats.map(t => new THREE.MeshLambertMaterial({ map: t }));
        }

        /**
         * ------------------------------------------------------------------
         * SYSTEM 2: CHUNK-BASED WORLD & PERLIN NOISE
         * ------------------------------------------------------------------
         */
        
        // Simple pseudo-random noise function (Simplex-like)
        class SimpleNoise {
            constructor() { this.p = new Uint8Array(512); for(let i=0;i<512;i++) this.p[i] = Math.floor(Math.random()*255); }
            fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            lerp(t, a, b) { return a + t * (b - a); }
            grad(hash, x, y, z) {
                const h = hash & 15; const u = h < 8 ? x : y; const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }
            noise(x, y, z) {
                const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
                x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
                const u = this.fade(x), v = this.fade(y), w = this.fade(z);
                const A = this.p[X] + Y, AA = this.p[A] + Z, AB = this.p[A + 1] + Z, B = this.p[X + 1] + Y, BA = this.p[B] + Z, BB = this.p[B + 1] + Z;
                return this.lerp(w, this.lerp(v, this.lerp(u, this.grad(this.p[AA], x, y, z), this.grad(this.p[BA], x - 1, y, z)),
                        this.lerp(u, this.grad(this.p[AB], x, y - 1, z), this.grad(this.p[BB], x - 1, y - 1, z))),
                    this.lerp(v, this.lerp(u, this.grad(this.p[AA + 1], x, y, z - 1), this.grad(this.p[BA + 1], x - 1, y, z - 1)),
                        this.lerp(u, this.grad(this.p[AB + 1], x, y - 1, z - 1), this.grad(this.p[BB + 1], x - 1, y - 1, z - 1))));
            }
        }

        const noiseGen = new SimpleNoise();
        const WORLD_SIZE = 64; // Total world width
        const CHUNK_SIZE = 16;
        const HEIGHT = 32;
        const voxels = {}; // Map "x,y,z" -> id

        function getVoxel(x, y, z) {
            return voxels[`${x},${y},${z}`] || 0;
        }

        function setVoxel(x, y, z, id) {
            if(id === 0) delete voxels[`${x},${y},${z}`];
            else voxels[`${x},${y},${z}`] = id;
        }

        // Initialize World Data
        function initWorld() {
            for (let x = 0; x < WORLD_SIZE; x++) {
                for (let z = 0; z < WORLD_SIZE; z++) {
                    // Height noise (scale coords for smoothness)
                    let n = noiseGen.noise(x * 0.05, 0, z * 0.05);
                    let h = Math.floor((n + 1) * 8) + 4; // Height 4 to 20

                    for (let y = 0; y <= h; y++) {
                        let type = 2; // Dirt
                        if (y === h) type = 1; // Grass
                        else if (y < h - 3) type = 3; // Stone

                        // Diamond chance
                        if (type === 3 && y < 5 && Math.random() > 0.98) type = 6;

                        setVoxel(x, y, z, type);
                    }
                    // Bedrock
                    setVoxel(x, 0, z, 3);
                    
                    // Trees
                    if (x > 2 && x < WORLD_SIZE-2 && z > 2 && z < WORLD_SIZE-2) {
                        if (Math.random() > 0.98 && getVoxel(x, h, z) === 1) {
                            // Trunk
                            setVoxel(x, h+1, z, 4);
                            setVoxel(x, h+2, z, 4);
                            setVoxel(x, h+3, z, 4);
                            // Leaves
                            for(let lx=x-1; lx<=x+1; lx++) {
                                for(let lz=z-1; lz<=z+1; lz++) {
                                    setVoxel(lx, h+3, lz, 5);
                                    setVoxel(lx, h+4, lz, 5);
                                }
                            }
                            setVoxel(x, h+5, z, 5);
                        }
                    }
                }
            }
        }

        /**
         * ------------------------------------------------------------------
         * SYSTEM 3: RENDERING & FACE CULLING
         * Builds meshes chunk by chunk, only drawing visible faces.
         * ------------------------------------------------------------------
         */
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue
        scene.fog = new THREE.Fog(0x87CEEB, 10, 60);

        // Meshes storage
        const chunks = []; 

        // Geometry helper
        const geometryBox = new THREE.BoxGeometry(1,1,1);
        
        function updateChunks() {
            // Remove old
            chunks.forEach(m => scene.remove(m));
            chunks.length = 0;

            // We group meshes by material to minimize draw calls, or simple InstancedMesh
            // For a robust "Single File" Minecraft, we will use a simplified approach:
            // Iterate blocks, if face exposed, add to a Geometry builder.
            
            // Since merging geometries is CPU heavy in JS, we will just use InstancedMesh for high performance.
            // 1 InstancedMesh per Block Type.
            
            const instances = {}; // { 1: [], 2: [] ... } array of matrix4
            
            for(let x=0; x<WORLD_SIZE; x++){
                for(let y=0; y<HEIGHT; y++){
                    for(let z=0; z<WORLD_SIZE; z++){
                        const id = getVoxel(x,y,z);
                        if(id === 0) continue;

                        // CULLING: Check neighbors
                        const blocked = 
                            getVoxel(x+1,y,z) && getVoxel(x-1,y,z) &&
                            getVoxel(x,y+1,z) && getVoxel(x,y-1,z) &&
                            getVoxel(x,y,z+1) && getVoxel(x,y,z-1);
                        
                        if(blocked) continue; // Hidden block

                        if(!instances[id]) instances[id] = [];
                        const dummy = new THREE.Object3D();
                        dummy.position.set(x, y, z);
                        dummy.updateMatrix();
                        instances[id].push(dummy.matrix);
                    }
                }
            }

            // Create Meshes
            Object.keys(instances).forEach(id => {
                const count = instances[id].length;
                const matArray = getBlockMaterial(id);
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                const mesh = new THREE.InstancedMesh(geometry, matArray, count);
                
                for (let i = 0; i < count; i++) {
                    mesh.setMatrixAt(i, instances[id][i]);
                }
                chunks.push(mesh);
                scene.add(mesh);
            });
        }

        /**
         * ------------------------------------------------------------------
         * SYSTEM 4: SETUP THREE.JS
         * ------------------------------------------------------------------
         */
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false }); // False for retro feel
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        /**
         * ------------------------------------------------------------------
         * SYSTEM 5: CONTROLS & PHYSICS
         * ------------------------------------------------------------------
         */
        const player = {
            x: WORLD_SIZE/2, y: 20, z: WORLD_SIZE/2,
            velX: 0, velY: 0, velZ: 0,
            onGround: false,
            speed: 50, jumpForce: 32, gravity: 32, height: 1.6, radius: 0.3
        };
        
        camera.position.set(player.x, player.y, player.z);

        // Input State
        const keys = { w: false, a: false, s: false, d: false, space: false };
        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW') keys.w = true;
            if(e.code === 'KeyA') keys.a = true;
            if(e.code === 'KeyS') keys.s = true;
            if(e.code === 'KeyD') keys.d = true;
            if(e.code === 'Space') keys.space = true;
            
            // Hotbar Numbers
            if(e.key >= '1' && e.key <= '9') selectSlot(parseInt(e.key)-1);
            // Inventory Toggle
            if(e.code === 'KeyE') toggleInventory();
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW') keys.w = false;
            if(e.code === 'KeyA') keys.a = false;
            if(e.code === 'KeyS') keys.s = false;
            if(e.code === 'KeyD') keys.d = false;
            if(e.code === 'Space') keys.space = false;
        });

        // Pointer Lock
        let isLocked = false;
        document.body.addEventListener('click', () => {
            if (!isLocked && !inventoryOpen) document.body.requestPointerLock();
        });
        document.addEventListener('pointerlockchange', () => {
            isLocked = (document.pointerLockElement === document.body);
        });
        
        // Mouse Look
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        document.addEventListener('mousemove', (e) => {
            if (isLocked) {
                euler.setFromQuaternion(camera.quaternion);
                euler.y -= e.movementX * 0.002;
                euler.x -= e.movementY * 0.002;
                euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                camera.quaternion.setFromEuler(euler);
            }
        });

        // Physics Loop
        const clock = new THREE.Clock();
        
        function updatePhysics(dt) {
            if (!isLocked) return; // Pause physics in menu

            // 1. Input Forces
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            forward.y = 0; forward.normalize();
            right.y = 0; right.normalize();

            let dx = 0, dz = 0;
            if (keys.w) { dx += forward.x; dz += forward.z; }
            if (keys.s) { dx -= forward.x; dz -= forward.z; }
            if (keys.a) { dx -= right.x; dz -= right.z; }
            if (keys.d) { dx += right.x; dz += right.z; }

            // Normalize diagonal
            if (dx !== 0 || dz !== 0) {
                const len = Math.sqrt(dx*dx + dz*dz);
                dx /= len; dz /= len;
            }

            // Apply velocity
            player.velX = dx * player.speed;
            player.velZ = dz * player.speed;

            // Gravity
            player.velY -= player.gravity * dt;
            if (player.onGround && keys.space) {
                player.velY = player.jumpForce;
                player.onGround = false;
            }

            // 2. Collision Detection (Simple AABB against Voxels)
            // Try X movement
            if (checkCollision(player.x + player.velX * dt, player.y, player.z)) player.velX = 0;
            player.x += player.velX * dt;

            // Try Z movement
            if (checkCollision(player.x, player.y, player.z + player.velZ * dt)) player.velZ = 0;
            player.z += player.velZ * dt;

            // Try Y movement
            if (checkCollision(player.x, player.y + player.velY * dt, player.z)) {
                if (player.velY < 0) player.onGround = true;
                player.velY = 0;
            } else {
                player.onGround = false;
            }
            player.y += player.velY * dt;
            
            // Kill floor
            if (player.y < -10) { player.y = 30; player.velY = 0; }

            camera.position.set(player.x, player.y, player.z);
        }

        function checkCollision(x, y, z) {
            // Check player bounding box (height 1.6, width 0.6) against integer blocks
            // We check feet, center, and head corners
            const padding = 0.25;
            const minX = Math.floor(x - padding);
            const maxX = Math.floor(x + padding);
            const minZ = Math.floor(z - padding);
            const maxZ = Math.floor(z + padding);
            const minY = Math.floor(y - 1.5); // Feet
            const maxY = Math.floor(y + 0.1); // Head

            for (let ix = minX; ix <= maxX; ix++) {
                for (let iy = minY; iy <= maxY; iy++) {
                    for (let iz = minZ; iz <= maxZ; iz++) {
                        if (getVoxel(ix, iy, iz) !== 0) return true;
                    }
                }
            }
            return false;
        }

        /**
         * ------------------------------------------------------------------
         * SYSTEM 6: RAYCASTING & INTERACTION
         * ------------------------------------------------------------------
         */
        
        // Selection Box
        const selectGeo = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.BoxGeometry(1.01, 1.01, 1.01)),
            new THREE.LineBasicMaterial({ color: 0x000000 })
        );
        scene.add(selectGeo);
        selectGeo.visible = false;

        let targetBlock = null;
        let placeBlock = null;

        function raycast() {
            const start = camera.position.clone();
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const maxDist = 5;
            
            // Raymarching
            let pos = start.clone();
            const step = dir.clone().multiplyScalar(0.05); // Precision
            
            targetBlock = null;
            placeBlock = null;
            
            let lastAir = null;

            for(let d=0; d<maxDist; d+=0.05) {
                pos.add(step);
                const ix = Math.round(pos.x);
                const iy = Math.round(pos.y);
                const iz = Math.round(pos.z);
                
                const id = getVoxel(ix, iy, iz);
                if (id !== 0) {
                    // Hit
                    targetBlock = { x: ix, y: iy, z: iz };
                    if (lastAir) placeBlock = { x: lastAir.x, y: lastAir.y, z: lastAir.z };
                    
                    // Update selection box
                    selectGeo.position.set(ix, iy, iz);
                    selectGeo.visible = true;
                    return;
                }
                lastAir = { x: ix, y: iy, z: iz };
            }
            selectGeo.visible = false;
        }

        // Click Handler
        document.addEventListener('mousedown', (e) => {
            if(!isLocked) return;
            
            // Animation
            hand.rotation.x = -0.5; // Swing
            setTimeout(() => hand.rotation.x = 0, 150);

            if (e.button === 0 && targetBlock) { // Left Click: Break
                setVoxel(targetBlock.x, targetBlock.y, targetBlock.z, 0);
                updateChunks();
            }
            if (e.button === 2 && placeBlock) { // Right Click: Place
                // Check if player is inside
                const px = Math.round(player.x);
                const py = Math.round(player.y); // Approx
                const pz = Math.round(player.z);
                // Simple check to avoid self-trapping
                if(Math.abs(placeBlock.x - player.x) < 0.5 && Math.abs(placeBlock.z - player.z) < 0.5 && (placeBlock.y >= player.y - 1.5 && placeBlock.y <= player.y + 0.5)) {
                    return; // Blocked by player
                }
                
                const idToPlace = hotbarSlots[activeSlotIndex].id;
                setVoxel(placeBlock.x, placeBlock.y, placeBlock.z, idToPlace);
                updateChunks();
            }
        });

        /**
         * ------------------------------------------------------------------
         * SYSTEM 7: UI, HOTBAR & INVENTORY
         * ------------------------------------------------------------------
         */
        
        const hotbarEl = document.getElementById('hotbar-container');
        const invGrid = document.getElementById('inv-grid');
        const inventoryEl = document.getElementById('inventory');
        
        const hotbarSlots = [
            { id: 1, name: "Grass" },
            { id: 2, name: "Dirt" },
            { id: 3, name: "Stone" },
            { id: 4, name: "Wood" },
            { id: 5, name: "Leaves" },
            { id: 6, name: "Diamond" },
            { id: 1, name: "Grass" },
            { id: 2, name: "Dirt" },
            { id: 3, name: "Stone" },
        ];
        
        let activeSlotIndex = 0;
        let inventoryOpen = false;

        function initUI() {
            hotbarEl.innerHTML = '';
            hotbarSlots.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'slot';
                if (idx === 0) div.classList.add('active');
                div.innerText = idx + 1;
                // Mini preview could go here
                div.style.backgroundColor = getBlockColor(item.id);
                hotbarEl.appendChild(div);
            });

            // Inventory Items
            invGrid.innerHTML = '';
            [1, 2, 3, 4, 5, 6].forEach(id => {
                const div = document.createElement('div');
                div.className = 'inv-item';
                div.style.backgroundColor = getBlockColor(id);
                div.innerText = BLOCKS[id].name;
                div.onclick = () => {
                    hotbarSlots[activeSlotIndex] = { id: id, name: BLOCKS[id].name };
                    initUI(); // Refresh
                };
                invGrid.appendChild(div);
            });
        }

        function getBlockColor(id) {
            // Helper for UI colors
            if(id==1) return '#5bac36';
            if(id==2) return '#754828';
            if(id==3) return '#7d7d7d';
            if(id==4) return '#5c3a23';
            if(id==5) return '#3a6b22';
            if(id==6) return '#00ffff';
            return '#fff';
        }

        function selectSlot(idx) {
            activeSlotIndex = idx;
            Array.from(hotbarEl.children).forEach((c, i) => {
                if (i === idx) c.classList.add('active');
                else c.classList.remove('active');
            });
            updateHandColor();
        }

        // Scroll wheel
        document.addEventListener('wheel', (e) => {
            if(inventoryOpen) return;
            if(e.deltaY > 0) activeSlotIndex = (activeSlotIndex + 1) % 9;
            else activeSlotIndex = (activeSlotIndex - 1 + 9) % 9;
            selectSlot(activeSlotIndex);
        });

        function toggleInventory() {
            inventoryOpen = !inventoryOpen;
            if (inventoryOpen) {
                document.exitPointerLock();
                inventoryEl.style.display = 'block';
            } else {
                document.body.requestPointerLock();
                inventoryEl.style.display = 'none';
            }
        }

        /**
         * ------------------------------------------------------------------
         * SYSTEM 8: 3D HAND
         * ------------------------------------------------------------------
         */
        const handGeo = new THREE.BoxGeometry(0.4, 0.4, 1.2);
        const handMat = new THREE.MeshLambertMaterial({ color: 0x5bac36 }); // Default grass
        const hand = new THREE.Mesh(handGeo, handMat);
        hand.position.set(0.4, -0.4, -0.8);
        hand.rotation.y = -0.1;
        camera.add(hand);
        scene.add(camera);

        function updateHandColor() {
            const id = hotbarSlots[activeSlotIndex].id;
            hand.material.color.set(getBlockColor(id));
        }

        /**
         * ------------------------------------------------------------------
         * MAIN LOOP
         * ------------------------------------------------------------------
         */
        initWorld();
        updateChunks();
        initUI();
        updateHandColor();

        function animate() {
            requestAnimationFrame(animate);
            
            const dt = Math.min(clock.getDelta(), 0.1);
            
            updatePhysics(dt);
            raycast();

            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
